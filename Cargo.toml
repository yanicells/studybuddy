[workspace]
resolver = "2"
members = ["crates/core"]
default-members = ["crates/core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
studybuddy-core = { path = "crates/core" }
anyhow = "1"
chrono = { version = "0.4", features = ["clock"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
